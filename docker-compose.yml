# Local development infrastructure.
# The application code runs directly (uvicorn / vite) — this compose file
# exists to provide PostgreSQL with the pgvector extension, which is the only
# stateful dependency that cannot be faked.
#
#   docker compose up -d db
#   # then run backend + frontend per README.md

services:
  db:
    image: pgvector/pgvector:pg16
    container_name: pdf_qa_db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: pdf_qa
    ports:
      - "5432:5432"
    volumes:
      - pdf_qa_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d pdf_qa"]
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  pdf_qa_pgdata:
